# Not run yet: nothing has been pushed to GitHub. The first push will be the first run. See docs/release-checklist.md.
name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["24"]
        include:
          # the oldest Node the bridge package claims to support (engines: >=20.19)
          - os: ubuntu-latest
            node: "20.19"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (exact lockfile)
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Install Playwright Chromium (Linux needs system libraries)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Browser tests (real Chromium + built extension + bridge + MCP client)
        run: npm run test:e2e
      - name: Build, package and prove the build is reproducible
        run: npm run package -- --verify
      - name: Install the npm tarball outside the checkout and run it (HTTP + stdio)
        run: npm run package:check
      - name: Keep the release artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: anymcp-release
          path: release/
      - name: Keep test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-node${{ matrix.node }}
          path: test-results/
