name: A website does not work
description: Recording or running a tool fails on a particular site.
labels: ["site"]
body:
  - type: markdown
    attributes:
      value: |
        AnyMCP does not work on every website (see docs/known-limitations.md: iframes, file uploads, CAPTCHAs and
        sign-in are not supported). Reports about other sites help decide what to support next.
        Only name public pages. Never paste your bridge token, pairing code or private page content.
  - type: input
    id: site
    attributes:
      label: Site (public address, without personal parameters)
      placeholder: "https://books.toscrape.com/catalogue/category/books/mystery_3/"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: The task you taught
      placeholder: "Type a search term, press Search, return the result titles."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: The run status and reason from the Runs screen, or the step where recording went wrong.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AnyMCP version, browser and version
      placeholder: "AnyMCP 0.1.0, Chrome 157"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: The address and details above contain no tokens, pairing codes or private content.
          required: true
