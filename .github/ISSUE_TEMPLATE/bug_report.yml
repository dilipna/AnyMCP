name: Bug report
description: Something in AnyMCP did not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems: do not use this form**, report privately (see SECURITY.md).
        Never paste your bridge token, pairing code or pairing secret, and remove private page content.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: "I asked my AI app to … The run ended with … I expected …"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. … 2. … 3. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AnyMCP version
      description: Side panel → Settings → About AnyMCP, or `anymcp-bridge --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: ["Google Chrome", "Microsoft Edge", "Brave", "Other Chromium browser"]
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version and operating system
      placeholder: "Chrome 157 on Windows 11"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: AI app (MCP client) and connection
      options: ["Claude Code over HTTP", "Claude Code over stdio", "Claude Desktop (stdio)", "Cursor (stdio)", "Other client over HTTP", "Other client over stdio", "Not relevant"]
    validations:
      required: true
  - type: textarea
    id: run
    attributes:
      label: Run details (optional)
      description: |
        From the side panel's Runs screen: the status, reason and the "What happened" timeline. Developer details
        contain no typed values or page text, but check before pasting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed tokens, pairing codes, pairing secrets and private page content from this report.
          required: true
